<!DOCTYPE html>
<html>
<head>
    <title>Password Hash Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        .hash-output {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Password Hash Generator</h1>
    <p>Enter a password to generate its SHA-256 hash:</p>

    <input type="text" id="passwordInput" placeholder="Enter password" value="avu3">
    <button onclick="generateHash()">Generate Hash</button>

    <div class="hash-output" id="output"></div>

    <script>
        async function generateHash() {
            const password = document.getElementById('passwordInput').value;
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            document.getElementById('output').innerHTML = `
                <strong>Password:</strong> ${password}<br>
                <strong>SHA-256 Hash:</strong><br>
                ${hashHex}
            `;
        }

        // Generate on load
        window.onload = generateHash;
    </script>
</body>
</html>
