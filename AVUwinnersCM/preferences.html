    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --gold: #8B7347;
            --gray-light: #F5F5F5;
            --gray-mid: #CCCCCC;
            --gray-dark: #333333;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            background: var(--white);
            color: var(--gold);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        /* Typography - Dramatic Serif Headlines */
        h1 {
            font-family: 'Bodoni Moda', 'Didot', serif;
            font-weight: 900;
            font-size: 4.5rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: var(--black);
        }

        h2 {
            font-family: 'Bodoni Moda', 'Didot', serif;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: -0.01em;
            margin-bottom: 60px;
            margin-top: 100px;
            border-bottom: 1px solid var(--black);
            padding-bottom: 20px;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--gray-dark);
            margin-bottom: 80px;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 100px;
            border-bottom: 2px solid var(--black);
            padding-bottom: 60px;
        }

        .timestamp {
            font-size: 0.85rem;
            color: var(--gray-dark);
            margin-top: 30px;
            font-weight: 400;
        }

        /* Week Selector - Minimalist */
        .week-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 80px;
            padding: 40px;
            background: var(--gray-light);
        }

        .week-selector label {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .week-selector select {
            padding: 15px 25px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--black);
            cursor: pointer;
            min-width: 250px;
            transition: all 0.3s ease;
        }

        .week-selector select:hover {
            background: var(--black);
            color: var(--white);
        }

        .week-selector select:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        /* Stats Grid - Clean Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2px;
            margin-bottom: 100px;
            background: var(--black);
            border: 2px solid var(--black);
        }

        .stat-card {
            background: var(--white);
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: var(--black);
            color: var(--white);
        }

        .stat-card .value {
            font-family: 'Bodoni Moda', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .stat-card .label {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Charts Grid - Ample Whitespace */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 60px;
            margin-bottom: 100px;
        }

        .chart-container {
            background: var(--white);
            border: 1px solid var(--gray-mid);
            padding: 40px;
        }

        .chart-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.01em;
        }

        canvas {
            max-height: 350px;
        }

        /* Stock Distribution - Featured */
        .stock-section {
            margin-top: 120px;
            padding-top: 80px;
            border-top: 2px solid var(--black);
        }

        .stock-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px;
            border: 2px solid var(--black);
            background: var(--gray-light);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 2rem;
            }

            .container {
                padding: 60px 30px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .week-selector {
                flex-direction: column;
                gap: 20px;
            }
        }

        /* Sticky Navigation Header */
        .sticky-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: #FFFFFF;
            border-bottom: 1px solid #E5E5E5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            z-index: 1000;
            padding: 0 40px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold);
        }

        .nav-menu {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-menu a {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: var(--black);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background: var(--gold);
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -6px);
        }

        @media (max-width: 768px) {
            .sticky-nav {
                padding: 0 20px;
            }

            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                top: 50px;
                left: -100%;
                width: 100%;
                background: #FFFFFF;
                flex-direction: column;
                padding: 30px 20px;
                gap: 20px;
                border-bottom: 1px solid #E5E5E5;
                transition: left 0.3s ease;
            }

            .nav-menu.active {
                left: 0;
            }
        }

        /* Adjust body padding for fixed header */
        body {
            padding-top: 50px;
        }
    </style>

        "Unknown": 455

        // Chart instances
        let regionsChart, typesChart, priceTiersChart, dailyPricesChart, stockChart;

        // Chart.js defaults - Minimal Black & White with Gold accents
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.size = 12;
        Chart.defaults.font.weight = '300';
        Chart.defaults.color = '#8B7347';
        Chart.defaults.borderColor = '#CCCCCC';
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.plugins.legend.labels.padding = 20;

        // Color palettes - Gold variations (darker for higher tiers, lighter for lower tiers)
        const monoColors = ['#5A4A2F', '#6B5839', '#8B7347', '#A68F5F', '#BFA976', '#D4C294'];
        const monoGradient = (ctx, area) => {
            const gradient = ctx.createLinearGradient(0, area.bottom, 0, area.top);
            gradient.addColorStop(0, 'rgba(139, 115, 71, 0.1)');
            gradient.addColorStop(1, 'rgba(139, 115, 71, 0.4)');
            return gradient;
        };

        window.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            updateCharts();
        });

        function initializeCharts() {
            // Regions Chart - Bar
            regionsChart = new Chart(document.getElementById('regionsChart'), {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Campaigns',
                        data: [],
                        backgroundColor: '#8B7347',
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#F5F5F5' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });

            // Types Chart - Doughnut
            typesChart = new Chart(document.getElementById('typesChart'), {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: monoColors,
                        borderWidth: 2,
                        borderColor: '#FFFFFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '65%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 15 }
                        }
                    }
                }
            });

            // Price Tiers Chart - Pie
            priceTiersChart = new Chart(document.getElementById('priceTiersChart'), {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: monoColors,
                        borderWidth: 2,
                        borderColor: '#FFFFFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 15 }
                        }
                    }
                }
            });

            // Daily Prices Chart - Line
            dailyPricesChart = new Chart(document.getElementById('dailyPricesChart'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Avg Price (CHF)',
                        data: [],
                        borderColor: '#8B7347',
                        backgroundColor: (context) => {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            return monoGradient(ctx, chartArea);
                        },
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#8B7347',
                        pointBorderColor: '#FFFFFF',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#F5F5F5' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });

            // Stock Distribution Chart
            const stockLabels = Object.keys(stockData);
            const stockValues = Object.values(stockData);

            stockChart = new Chart(document.getElementById('stockChart'), {
                type: 'doughnut',
                data: {
                    labels: stockLabels,
                    datasets: [{
                        data: stockValues,
                        backgroundColor: monoColors,
                        borderWidth: 3,
                        borderColor: '#FFFFFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 20 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed.toLocaleString() + ' bottles';
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateCharts() {
            const selectedWeek = document.getElementById('weekSelect').value;
            const weekData = weeklyData.find(w => w.week_year === selectedWeek);

            if (!weekData) return;

            // Update summary stats
            document.getElementById('statsSummary').innerHTML = `
                <div class="stat-card">
                    <div class="value">${weekData.avg_vintage || 'N/A'}</div>
                    <div class="label">Avg Vintage</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.top_region}</div>
                    <div class="label">Top Region</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.total_unique_campaigns} <span style="font-size: 1rem; font-weight: 400;">(${weekData.total_unique_items} items)</span></div>
                    <div class="label">Unique Campaigns</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.horeca_count}</div>
                    <div class="label">HORECA</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.leads_count}</div>
                    <div class="label">Leads</div>
                </div>
            `;

            // Update charts
            const regionLabels = Object.keys(weekData.regions).slice(0, 10);
            const regionValues = Object.values(weekData.regions).slice(0, 10);
            regionsChart.data.labels = regionLabels;
            regionsChart.data.datasets[0].data = regionValues;
            regionsChart.update();

            const typeLabels = Object.keys(weekData.types).slice(0, 6);
            const typeValues = Object.values(weekData.types).slice(0, 6);
            typesChart.data.labels = typeLabels;
            typesChart.data.datasets[0].data = typeValues;
            typesChart.update();

            const tierLabels = Object.keys(weekData.price_tiers);
            const tierValues = Object.values(weekData.price_tiers);
            priceTiersChart.data.labels = tierLabels;
            priceTiersChart.data.datasets[0].data = tierValues;
            priceTiersChart.update();

            const dailyLabels = Object.keys(weekData.daily_avg_prices).sort();
            const dailyValues = dailyLabels.map(date => weekData.daily_avg_prices[date]);
            dailyPricesChart.data.labels = dailyLabels;
            dailyPricesChart.data.datasets[0].data = dailyValues;
            dailyPricesChart.update();
        }

        // Hamburger menu functionality
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('navMenu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            }
        });

        // Authentication check
        const REQUIRED_HASH = 'e5e64a57749fa919d423d0044da636d34b64c00fe580e338fcad56c9b105314f';
        const sessionAuth = sessionStorage.getItem('dashboardAuth');
        if (sessionAuth !== REQUIRED_HASH) {
            window.location.href = 'index.html';
        }
