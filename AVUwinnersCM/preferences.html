            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .analytics-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .week-selector {
            margin-bottom: 30px;
        }

        .week-selector label {
            font-size: 1.1em;
            font-weight: 600;
            margin-right: 15px;
            color: #333;
        }

        .week-selector select {
            padding: 10px 15px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            min-width: 250px;
        }

        .week-selector select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        canvas {
            max-height: 300px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

        window.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            updateCharts();
        });

        function initializeCharts() {
            // Regions Chart
            regionsChart = new Chart(document.getElementById('regionsChart'), {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Campaigns', data: [], backgroundColor: '#667eea' }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // Types Chart
            typesChart = new Chart(document.getElementById('typesChart'), {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b'] }] },
                options: { responsive: true, maintainAspectRatio: true }
            });

            // Price Tiers Chart
            priceTiersChart = new Chart(document.getElementById('priceTiersChart'), {
                type: 'pie',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a'] }] },
                options: { responsive: true, maintainAspectRatio: true }
            });

            // Daily Prices Chart
            dailyPricesChart = new Chart(document.getElementById('dailyPricesChart'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Avg Price (CHF)', data: [], borderColor: '#667eea', backgroundColor: 'rgba(102, 126, 234, 0.1)', fill: true }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: { y: { beginAtZero: true } }
                }
            });

            // Stock Distribution Chart
            const stockLabels = Object.keys(stockData);
            const stockValues = Object.values(stockData);

            stockChart = new Chart(document.getElementById('stockChart'), {
                type: 'doughnut',
                data: {
                    labels: stockLabels,
                    datasets: [{
                        data: stockValues,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed.toLocaleString() + ' bottles';
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateCharts() {
            const selectedWeek = document.getElementById('weekSelect').value;
            const weekData = weeklyData.find(w => w.week_year === selectedWeek);

            if (!weekData) return;

            // Update summary stats
            document.getElementById('statsSummary').innerHTML = `
                <div class="stat-card">
                    <div class="value">${weekData.avg_vintage || 'N/A'}</div>
                    <div class="label">Average Vintage</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.top_region}</div>
                    <div class="label">Top Region</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.total_campaigns}</div>
                    <div class="label">Total Campaigns</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.horeca_count}</div>
                    <div class="label">HORECA Offers</div>
                </div>
                <div class="stat-card">
                    <div class="value">${weekData.leads_count}</div>
                    <div class="label">LEADS Offers</div>
                </div>
            `;

            // Update Regions Chart
            const regionLabels = Object.keys(weekData.regions).slice(0, 10);
            const regionValues = Object.values(weekData.regions).slice(0, 10);
            regionsChart.data.labels = regionLabels;
            regionsChart.data.datasets[0].data = regionValues;
            regionsChart.update();

            // Update Types Chart
            const typeLabels = Object.keys(weekData.types);
            const typeValues = Object.values(weekData.types);
            typesChart.data.labels = typeLabels;
            typesChart.data.datasets[0].data = typeValues;
            typesChart.update();

            // Update Price Tiers Chart
            const tierLabels = Object.keys(weekData.price_tiers);
            const tierValues = Object.values(weekData.price_tiers);
            priceTiersChart.data.labels = tierLabels;
            priceTiersChart.data.datasets[0].data = tierValues;
            priceTiersChart.update();

            // Update Daily Prices Chart
            const dailyLabels = Object.keys(weekData.daily_avg_prices).sort();
            const dailyValues = dailyLabels.map(date => weekData.daily_avg_prices[date]);
            dailyPricesChart.data.labels = dailyLabels;
            dailyPricesChart.data.datasets[0].data = dailyValues;
            dailyPricesChart.update();
        }
